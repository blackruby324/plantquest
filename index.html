<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>식물 구별기</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f4f9f4; }
        .box { background: white; padding: 20px; border-radius: 10px; max-width: 500px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .main-title { color: #2e7d32; margin-bottom: 20px; }
        .character-wrapper { position: relative; display: inline-block; margin-bottom: 10px; }
        .character-img { width: 250px; height: 250px; object-fit: contain; }
        .stars-container { font-size: 2.2rem; min-height: 45px; margin-bottom: 15px; word-break: break-all; line-height: 1.2; }
        #preview { width: 100%; max-height: 350px; object-fit: cover; margin-top: 20px; border-radius: 8px; display: none; }
        #result { margin-top: 20px; font-size: 1.3rem; font-weight: bold; color: #2e7d32; }
        input[type="file"] { display: none; }
        .btn { background: #4caf50; color: white; padding: 15px 30px; border: none; border-radius: 5px; font-size: 1.1rem; cursor: pointer; display: inline-block; margin-top: 10px; }
    </style>
</head>
<body>

<div class="box">
    <h1 class="main-title">🌱 AI 식물 구별기 🌱</h1>

    <div class="character-wrapper">
        <img id="character" class="character-img" src="character.jpg" alt="캐릭터">
    </div>

    <div id="starsContainer" class="stars-container"></div>

    <div>
        <label for="cameraInput" class="btn">📷 사진 찍기 / 선택</label>
        <input type="file" id="cameraInput" accept="image/*" capture="environment">
    </div>

    <img id="preview" alt="선택한 식물 사진">
    <div id="result"></div>
</div>

<audio id="starSound" src="star.mp3" preload="auto"></audio>

<script>
    // 💡 발급받은 본인의 PlantNet API 키를 따옴표 안에 넣으세요
    const PLANTNET_API_KEY = "2b10oIwvXQvPxn9d5naM48a6e"; 

    const cameraInput = document.getElementById('cameraInput');
    const preview = document.getElementById('preview');
    const result = document.getElementById('result');
    const starsContainer = document.getElementById('starsContainer');
    const starSound = document.getElementById('starSound');

    let starCount = 0;
    const foundPlants = new Set();

    cameraInput.addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            preview.src = event.target.result;
            preview.style.display = 'block';
        };
        reader.readAsDataURL(file);

        result.innerHTML = "🔍 AI가 식물을 분석 중입니다...";

        if (!PLANTNET_API_KEY || PLANTNET_API_KEY === "YOUR_API_KEY_HERE") {
            result.innerHTML = "⚠️ API 키가 설정되지 않았습니다.<br><span style='font-size:0.9rem;'>코드 내 API 키를 입력해주세요.</span>";
            return;
        }

        try {
            const formData = new FormData();
            formData.append('images', file);
            formData.append('organs', 'auto');

            // CORS 차단을 우회하여 데이터 전송 (프록시 적용)
            const targetApi = `https://my-api.plantnet.org/v2/identify/all?api-key=${PLANTNET_API_KEY}&lang=ko`;
            const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetApi)}`;

            const response = await fetch(proxyUrl, {
                method: 'POST',
                body: formData
            });

            if (!response.ok) {
                result.innerHTML = "❌ 식물을 식별할 수 없습니다.<br><span style='font-size:0.85rem; color:#666;'>잎이나 꽃이 잘 보이게 선명한 사진을 사용해보세요.</span>";
                return;
            }

            const data = await response.json();

            if (data.results && data.results.length > 0) {
                const topResult = data.results[0];
                
                // 한국어 이름 추출 (없으면 학명)
                let plantName = "";
                if (topResult.species.commonNames && topResult.species.commonNames.length > 0) {
                    plantName = topResult.species.commonNames[0];
                } else {
                    plantName = topResult.species.scientificNameWithoutAuthor;
                }

                const score = Math.round(topResult.score * 100);

                if (foundPlants.has(plantName)) {
                    result.innerHTML = `결과: 🌿 <b>${plantName}</b> (${score}% 일치)<br><span style="font-size:0.95rem; color:#888;">(이미 발견한 식물입니다)</span>`;
                } else {
                    foundPlants.add(plantName);
                    starCount++;
                    starsContainer.innerHTML = "⭐".repeat(starCount);
                    result.innerHTML = `결과: 🌿 <b>${plantName}</b> (${score}% 일치) 첫 발견! ⭐ +1`;

                    if (starSound) {
                        starSound.currentTime = 0;
                        starSound.play().catch(err => console.log("음원 재생 권한 필요:", err));
                    }
                }
            } else {
                result.innerHTML = "❌ 식물을 인식하지 못했습니다.";
            }
        } catch (error) {
            console.error(error);
            result.innerHTML = "⚠️ 네트워크 통신에 실패했습니다.";
        }
    });
</script>

</body>
</html>
