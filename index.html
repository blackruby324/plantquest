<script>
    // 💡 본인의 PlantNet API 키를 여기에 넣으세요!
    const PLANTNET_API_KEY = "2b10oIwvXQvPxn9d5naM48a6e"; 

    const cameraInput = document.getElementById('cameraInput');
    const preview = document.getElementById('preview');
    const result = document.getElementById('result');
    const starsContainer = document.getElementById('starsContainer');
    const starSound = document.getElementById('starSound');

    let starCount = 0;
    const foundPlants = new Set();

    cameraInput.addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (!file) return;

        // 선택한 이미지 미리보기
        const reader = new FileReader();
        reader.onload = function(event) {
            preview.src = event.target.result;
            preview.style.display = 'block';
        };
        reader.readAsDataURL(file);

        result.innerHTML = "🔍 AI가 식물을 분석 중입니다...";

        // API 키 미입력 체크
        if (!PLANTNET_API_KEY || PLANTNET_API_KEY === "YOUR_API_KEY_HERE") {
            result.innerHTML = "⚠️ API 키가 설정되지 않았습니다.<br><span style='font-size:0.9rem;'>my.plantnet.org에서 키를 발급받아 입력해주세요.</span>";
            return;
        }

        try {
            const formData = new FormData();
            formData.append('images', file);
            formData.append('organs', 'auto');

            // PlantNet API 요청
            const apiUrl = `https://my-api.plantnet.org/v2/identify/all?api-key=${PLANTNET_API_KEY}&lang=ko`;
            const response = await fetch(apiUrl, {
                method: 'POST',
                body: formData
            });

            if (!response.ok) {
                if (response.status === 404) {
                    result.innerHTML = "❌ 식물을 인식하지 못했습니다. (다른 각도로 찍어보세요)";
                } else if (response.status === 401 || response.status === 403) {
                    result.innerHTML = "⚠️ API 키가 올바르지 않습니다.";
                } else {
                    result.innerHTML = `⚠️ 서버 오류가 발생했습니다. (에러 코드: ${response.status})`;
                }
                return;
            }

            const data = await response.json();

            if (data.results && data.results.length > 0) {
                const topResult = data.results[0];
                
                // 한글 이름이 없을 경우 일반 이름 또는 학명 추출
                let plantName = "알 수 없는 식물";
                if (topResult.species.commonNames && topResult.species.commonNames.length > 0) {
                    plantName = topResult.species.commonNames[0];
                } else if (topResult.species.scientificNameWithoutAuthor) {
                    plantName = topResult.species.scientificNameWithoutAuthor;
                }

                const score = Math.round(topResult.score * 100);

                if (foundPlants.has(plantName)) {
                    result.innerHTML = `결과: 🌿 <b>${plantName}</b> (${score}% 일치)<br><span style="font-size:0.95rem; color:#888;">(이미 발견한 식물입니다)</span>`;
                } else {
                    foundPlants.add(plantName);
                    starCount++;
                    starsContainer.innerHTML = "⭐".repeat(starCount);
                    result.innerHTML = `결과: 🌿 <b>${plantName}</b> (${score}% 일치) 첫 발견! ⭐ +1`;

                    // 효과음 재생
                    if (starSound) {
                        starSound.currentTime = 0;
                        starSound.play().catch(err => console.log("음원 재생 권한 필요:", err));
                    }
                }
            } else {
                result.innerHTML = "❌ 식물을 인식하지 못했습니다. 다시 찍어주세요.";
            }
        } catch (error) {
            console.error(error);
            result.innerHTML = "⚠️ 네트워크 오류 또는 이미지 전송에 실패했습니다.";
        }
    });
</script>
