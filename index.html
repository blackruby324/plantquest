<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>식물 구별기</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f4f9f4; }
        .box { background: white; padding: 20px; border-radius: 10px; max-width: 500px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .main-title { color: #2e7d32; margin-bottom: 20px; }
        .character-wrapper { position: relative; display: inline-block; margin-bottom: 10px; }
        .character-img { width: 250px; height: 250px; object-fit: contain; }
        .stars-container { font-size: 2.2rem; min-height: 45px; margin-bottom: 15px; word-break: break-all; line-height: 1.2; }
        #preview { width: 100%; max-height: 350px; object-fit: cover; margin-top: 20px; border-radius: 8px; display: none; }
        #result { margin-top: 20px; font-size: 1.3rem; font-weight: bold; color: #2e7d32; }
        input[type="file"] { display: none; }
        .btn { background: #4caf50; color: white; padding: 15px 30px; border: none; border-radius: 5px; font-size: 1.1rem; cursor: pointer; display: inline-block; margin-top: 10px; }
    </style>
</head>
<body>

<div class="box">
    <h1 class="main-title">🌱 AI 식물 구별기 🌱</h1>

    <div class="character-wrapper">
        <img id="character" class="character-img" src="character.jpg" alt="캐릭터">
    </div>

    <div id="starsContainer" class="stars-container"></div>

    <div>
        <label for="cameraInput" class="btn">📷 사진 찍기 / 선택</label>
        <input type="file" id="cameraInput" accept="image/*" capture="environment">
    </div>

    <img id="preview" alt="선택한 식물 사진">
    <div id="result"></div>
</div>

<audio id="starSound" src="star.mp3" preload="auto"></audio>

<script>
    // 💡 본인의 Plant.id API 키를 입력하세요.
    const PLANT_ID_API_KEY = "693ZjbtN2eKVVZxShf5kwx49yMNnm5kpoW0pcrzwMcemhrvWpI"; 

    const cameraInput = document.getElementById('cameraInput');
    const preview = document.getElementById('preview');
    const result = document.getElementById('result');
    const starsContainer = document.getElementById('starsContainer');
    const starSound = document.getElementById('starSound');

    let starCount = 0;
    const foundPlants = new Set();

    // 주요 식물 영한 번역 사전
    const plantDictionary = {
        "monstera": "몬스테라", "monstera deliciosa": "몬스테라",
        "rose": "장미", "rosa": "장미",
        "tulip": "튤립", "tulipa": "튤립",
        "sunflower": "해바라기", "helianthus": "해바라기",
        "cactus": "선인장", "cactaceae": "선인장",
        "sansevieria": "산세베리아", "dracaena trifasciata": "산세베리아",
        "peace lily": "스파티필름", "spathiphyllum": "스파티필름",
        "basil": "바질", "ocimum basilicum": "바질",
        "rosemary": "로즈마리", "salvia rosmarinus": "로즈마리",
        "ivy": "아이비", "hedera": "아이비",
        "succulent": "다육식물", "echeveria": "에케베리아(다육이)",
        "rubber tree": "고무나무", "ficus elastica": "고무나무",
        "dandelion": "민들레", "taraxacum": "민들레",
        "cherry blossom": "벚꽃", "prunus": "벚나무/벚꽃",
        "maple": "단풍나무", "acer": "단풍나무",
        "pine": "소나무", "pinus": "소나무",
        "hydrangea": "수국", "hydrangea macrophylla": "수국",
        "orchid": "난초", "orchidaceae": "난초"
    };

    // 영문 이름을 한글로 자동 번역해주는 자체 엔진 함수
    function translatePlantName(englishName) {
        if (!englishName) return "알 수 없는 식물";

        const lowerName = englishName.toLowerCase().trim();

        // 1. 사전 단어 일치 여부 검사
        for (let key in plantDictionary) {
            if (lowerName.includes(key)) {
                return plantDictionary[key];
            }
        }

        // 2. 사전에 없으면 발음식 음차 처리 규칙 적용
        let translated = englishName
            .replace(/Monstera/gi, "몬스테라")
            .replace(/Rose/gi, "장미")
            .replace(/Lily/gi, "백합")
            .replace(/Palm/gi, "야자")
            .replace(/Tree/gi, "나무")
            .replace(/Flower/gi, "꽃")
            .replace(/Leaf/gi, "잎");

        return translated;
    }

    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => {
                const base64String = reader.result.toString();
                const pureBase64 = base64String.includes(',') ? base64String.split(',')[1] : base64String;
                resolve(pureBase64);
            };
            reader.onerror = error => reject(error);
        });
    }

    cameraInput.addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            preview.src = event.target.result;
            preview.style.display = 'block';
        };
        reader.readAsDataURL(file);

        result.innerHTML = "🔍 Plant.id AI 분석 및 자체 한글 번역 중...";

        if (!PLANT_ID_API_KEY || PLANT_ID_API_KEY === "YOUR_PLANT_ID_API_KEY") {
            result.innerHTML = "⚠️ API 키가 설정되지 않았습니다.";
            return;
        }

        try {
            const base64Image = await fileToBase64(file);

            // API 400 에러를 발생시키지 않는 가장 기본적이고 안전한 원본 Payload
            const response = await fetch('https://plant.id/api/v3/identification', {
                method: 'POST',
                headers: {
                    'Api-Key': PLANT_ID_API_KEY,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    images: [base64Image],
                    similar_images: true
                })
            });

            if (!response.ok) {
                if (response.status === 429) {
                    result.innerHTML = "⚠️ 무료 사용량(100회)이 다 찼습니다. 잠시 후 시도하세요.";
                } else {
                    result.innerHTML = `⚠️ 서버 통신 문제 (상태 코드: ${response.status})`;
                }
                return;
            }

            const data = await response.json();

            if (data.result && data.result.classification && data.result.classification.suggestions.length > 0) {
                const topMatch = data.result.classification.suggestions[0];
                
                // 1. API가 준 원본 식물명(영문/학명)
                const rawName = topMatch.name;

                // 2. 자체 한글 번역 엔진 통과
                const plantName = translatePlantName(rawName);

                const score = Math.round(topMatch.probability * 100);

                if (foundPlants.has(plantName)) {
                    result.innerHTML = `결과: 🌿 <b>${plantName}</b> (${score}% 일치)<br><span style="font-size:0.85rem; color:#888;">(영문명: ${rawName}) - 이미 발견함</span>`;
                } else {
                    foundPlants.add(plantName);
                    starCount++;
                    starsContainer.innerHTML = "⭐".repeat(starCount);
                    result.innerHTML = `결과: 🌿 <b>${plantName}</b> (${score}% 일치) 첫 발견! ⭐ +1<br><span style="font-size:0.8rem; color:#888;">(원래이름: ${rawName})</span>`;

                    if (starSound) {
                        starSound.currentTime = 0;
                        starSound.play().catch(err => console.log("음원 재생 권한 제한:", err));
                    }
                }
            } else {
                result.innerHTML = "❌ 식물을 인식하지 못했습니다.";
            }

        } catch (error) {
            console.error(error);
            result.innerHTML = "⚠️ 이미지 분석 중 오류가 발생했습니다.";
        }
    });
</script>

</body>
</html>
