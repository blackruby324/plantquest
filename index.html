<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌱 어린이 식물 탐험대 🌱</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f4f9f4; margin: 0; }
        .box { background: white; padding: 20px; border-radius: 20px; max-width: 500px; margin: 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .main-title { color: #2e7d32; margin-bottom: 15px; font-size: 1.8rem; }
        .character-wrapper { position: relative; display: inline-block; margin-bottom: 10px; }
        .character-img { width: 400px; height: 400px; object-fit: contain; }
        .stars-container { font-size: 2.5rem; min-height: 50px; margin-bottom: 15px; word-break: break-all; line-height: 1.2; }
        #preview { width: 100%; max-height: 250px; object-fit: cover; margin-top: 15px; border-radius: 12px; display: none; }
        #result { margin-top: 15px; font-size: 1.25rem; font-weight: bold; color: #2e7d32; line-height: 1.5; }
        
        /* OX 퀴즈 상자 */
        #quizBox { display: none; margin-top: 20px; padding: 20px; background: #fffde7; border: 3px dashed #fbc02d; border-radius: 18px; }
        .quiz-title { font-size: 1.3rem; color: #e65100; margin-bottom: 20px; font-weight: bold; word-break: keep-all; line-height: 1.4; }
        
        /* OX 터치 버튼 */
        .ox-btn-container { display: flex; justify-content: center; gap: 25px; margin-bottom: 10px; }
        .ox-btn { border: none; width: 90px; height: 90px; border-radius: 50%; font-size: 3rem; font-weight: bold; cursor: pointer; transition: transform 0.1s; }
        .ox-btn:active { transform: scale(0.9); }
        .btn-o { background: #4caf50; color: white; box-shadow: 0 6px #2e7d32; }
        .btn-x { background: #f44336; color: white; box-shadow: 0 6px #c62828; }
        
        #quizFeedback { margin-top: 15px; font-weight: bold; font-size: 1.2rem; word-break: keep-all; }

        input[type="file"] { display: none; }
        .btn { background: #4caf50; color: white; padding: 15px 30px; border: none; border-radius: 12px; font-size: 1.3rem; cursor: pointer; display: inline-block; margin-top: 10px; font-weight: bold; box-shadow: 0 5px #2e7d32; }
        .btn:active { box-shadow: 0 0 #2e7d32; transform: translateY(5px); }
    </style>
</head>
<body>

<div class="box">
    <h1 class="main-title">🌱 AI 식물 탐험대 🌱</h1>

    <div class="character-wrapper">
        <img id="character" class="character-img" src="character.png" alt="캐릭터">
    </div>

    <div id="starsContainer" class="stars-container"></div>

    <div>
        <label for="cameraInput" class="btn">📷 식물 찍기!</label>
        <input type="file" id="cameraInput" accept="image/*" capture="environment">
    </div>

    <img id="preview" alt="선택한 식물 사진">
    <div id="result"></div>

    <!-- OX 퀴즈 영역 -->
    <div id="quizBox">
        <div id="quizQuestion" class="quiz-title"></div>
        
        <div class="ox-btn-container">
            <button class="ox-btn btn-o" onclick="checkOX('O')">O</button>
            <button class="ox-btn btn-x" onclick="checkOX('X')">X</button>
        </div>

        <div id="quizFeedback"></div>
    </div>
</div>

<audio id="starSound" src="star.mp3" preload="auto"></audio>

<script>
    // 키 입력란
    const PLANT_ID_API_KEY = "693ZjbtN2eKVVZxShf5kwx49yMNnm5kpoW0pcrzwMcemhrvWpI"; 

    const cameraInput = document.getElementById('cameraInput');
    const preview = document.getElementById('preview');
    const result = document.getElementById('result');
    const starsContainer = document.getElementById('starsContainer');
    const starSound = document.getElementById('starSound');

    const quizBox = document.getElementById('quizBox');
    const quizQuestion = document.getElementById('quizQuestion');
    const quizFeedback = document.getElementById('quizFeedback');

    let starCount = 0;
    const foundPlants = new Set();

    let currentPlant = "";
    let currentQuiz = null;

    const plantDictionary = {
        // [들꽃 / 길가 식물]
        "dandelion": "민들레",
        "taraxacum": "민들레",
        "clover": "토끼풀(클로버)",
        "trifolium": "토끼풀",
        "aster": "쑥부쟁이",
        "fleabane": "개망초",
        "erigeron": "개망초",
        "plantago": "질경이",
        "chrysanthemum": "국화",
        "cosmos": "코스모스",
        "capsella": "냉이",
        "equisetum": "쇠뜸이",
        "violet": "제비꽃",
        "viola": "제비꽃",
        "oxalis": "괭이밥",
        "chickweed": "별꽃",
        "impatiens": "봉선화",
        "morning glory": "나팔꽃",
        "ipomoea": "나팔꽃",

        // [인기 꽃 / 원예 식물]
        "rose": "장미",
        "rosa": "장미",
        "tulip": "튤립",
        "tulipa": "튤립",
        "sunflower": "해바라기",
        "helianthus": "해바라기",
        "hydrangea": "수국",
        "lily": "백합",
        "lilium": "백합",
        "carnation": "카네이션",
        "dianthus": "패랭이꽃",
        "marigold": "메리골드",
        "azalea": "진달래/철쭉",
        "rhododendron": "철쭉/진달래",
        "forsythia": "개나리",
        "camellia": "동백나무",
        "geranium": "제라늄",
        "lavender": "라벤더",

        // [나무 / 가로수]
        "pine": "소나무",
        "pinus": "소나무",
        "ginkgo": "은행나무",
        "maple": "단풍나무",
        "acer": "단풍나무",
        "cherry blossom": "벚나무",
        "prunus": "벚나무/매화",
        "zelkova": "느티나무",
        "metasequoia": "메타세쿼이아",
        "willow": "버드나무",
        "salix": "버드나무",
        "oak": "참나무(도토리)",
        "quercus": "참나무",
        "bamboo": "대나무",
        "magnolia": "목련",

        // [집에서 키우는 관엽식물 / 다육이]
        "monstera": "몬스테라",
        "sansevieria": "산세베리아",
        "dracaena": "행운목/드라세나",
        "strelitzia": "여인초",
        "spathiphyllum": "스파트필름",
        "epipremnum": "스킨답서스",
        "pothos": "스킨답서스",
        "ivy": "아이비",
        "hedera": "아이비",
        "cactus": "선인장",
        "cactaceae": "선인장",
        "succulent": "다육식물",
        "echeveria": "에케베리아(다육이)",
        "ficus": "고무나무",
        "zamioculcas": "금전수(돈나무)",

        // [허브 / 채소 / 과일]
        "basil": "바질",
        "mint": "박하/민트",
        "rosemary": "로즈마리",
        "strawberry": "딸기",
        "fragaria": "딸기",
        "tomato": "토마토",
        "pepper": "고추",
        "capsicum": "고추",
        "cucumber": "오이",
        "lettuce": "상추"
    };

    // OX 퀴즈 DB
    const quizDatabase = {
        "장미": { q: "❓ 장미는 빨간색 꽃일까요?", ans: "O" },
        "선인장": { q: "❓ 선인장 가시를 만지면 아플까요?", ans: "O" },
        "해바라기": { q: "❓ 해바라기는 햇님을 좋아할까요?", ans: "O" },
        "몬스테라": { q: "❓ 몬스테라 잎에는 구멍이 뚫려 있을까요?", ans: "O" },
        "민들레": { q: "❓ 민들레 씨앗은 물속에서 날아갈까요?", ans: "X" },
        "소나무": { q: "❓ 소나무 잎은 동글동글 부드러울까요?", ans: "X" },
        "튤립": { q: "❓ 튤립은 예쁜 꽃일까요?", ans: "O" },
        "바질": { q: "❓ 바질은 분홍색 잎을 가졌을까요?", ans: "X" },
        "산세베리아": { q: "❓ 산세베리아는 키가 길쭉할까요?", ans: "O" },
        "진달래/철쭉": { q: "❓ 철쭉과 진달래는 예쁜 핑크색 꽃을 피울까요?", ans: "O" },
        "토끼풀(클로버)": { q: "❓ 네잎클로버를 찾으면 행운이 올까요?", ans: "O" },
        "은행나무": { q: "❓ 가을이 되면 은행나무 잎은 노랗게 변할까요?", ans: "O" },
        "단풍나무": { q: "❓ 가을 단풍나무 잎은 파란색으로 변할까요?", ans: "X" },
        "default": { q: "❓ 식물 친구는 물을 먹어야 잘 자랄까요?", ans: "O" }
    };

    function translatePlantName(englishName) {
        if (!englishName) return "알 수 없는 식물";
        const lowerName = englishName.toLowerCase().trim();

        for (let key in plantDictionary) {
            if (lowerName.includes(key)) {
                return plantDictionary[key];
            }
        }
        return englishName;
    }

    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => {
                const base64String = reader.result.toString();
                const pureBase64 = base64String.includes(',') ? base64String.split(',')[1] : base64String;
                resolve(pureBase64);
            };
            reader.onerror = error => reject(error);
        });
    }

    cameraInput.addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (!file) return;

        quizBox.style.display = 'none';
        quizFeedback.innerHTML = '';

        const reader = new FileReader();
        reader.onload = function(event) {
            preview.src = event.target.result;
            preview.style.display = 'block';
        };
        reader.readAsDataURL(file);

        result.innerHTML = "🔍 어떤 식물 친구일까? 찾아보는 중...";

        if (!PLANT_ID_API_KEY || PLANT_ID_API_KEY === "YOUR_PLANT_ID_API_KEY") {
            result.innerHTML = "⚠️ API 키가 설정되지 않았습니다!<br><span style='font-size:0.9rem; color:#666;'>코드 상단의 PLANT_ID_API_KEY 부분에 발급받은 키를 입력해주세요.</span>";
            return;
        }

        try {
            const base64Image = await fileToBase64(file);

            const response = await fetch('https://plant.id/api/v3/identification', {
                method: 'POST',
                headers: {
                    'Api-Key': PLANT_ID_API_KEY,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    images: [base64Image],
                    similar_images: true
                })
            });

            if (!response.ok) {
                if (response.status === 401) {
                    result.innerHTML = "⚠️ API 키가 올바르지 않습니다. (401 오류)";
                } else if (response.status === 429) {
                    result.innerHTML = "⚠️ API 사용량이 초과되었습니다. (429 오류)";
                } else {
                    result.innerHTML = `⚠️ 식물을 찾지 못했습니다. (오류 코드: ${response.status})`;
                }
                return;
            }

            const data = await response.json();

            if (data.result && data.result.classification && data.result.classification.suggestions.length > 0) {
                const topMatch = data.result.classification.suggestions[0];
                currentPlant = translatePlantName(topMatch.name);

                if (foundPlants.has(currentPlant)) {
                    result.innerHTML = `🌿 <b>${currentPlant}</b> 발견!<br><span style="font-size:0.9rem; color:#888;">(이미 별을 받은 식물이에요!)</span>`;
                } else {
                    result.innerHTML = `🌿 <b>${currentPlant}</b> 친구를 찾았어요!<br><span style="color:#e65100; font-weight:bold;">⭐ O, X 버튼을 눌러 정답을 맞춰보세요!</span>`;
                    
                    currentQuiz = quizDatabase[currentPlant] || quizDatabase["default"];
                    quizQuestion.innerHTML = `<b>[${currentPlant} 퀴즈]</b><br>${currentQuiz.q}`;
                    quizBox.style.display = 'block';
                }
            } else {
                result.innerHTML = "❌ 식물을 인식하지 못했어요. 선명하게 다시 찍어주세요!";
            }

        } catch (error) {
            console.error(error);
            result.innerHTML = "⚠️ 네트워크 오류가 발생했거나 서버 연결 실패입니다.";
        }
    });

    function checkOX(userChoice) {
        if (!currentQuiz) return;

        if (userChoice === currentQuiz.ans) {
            foundPlants.add(currentPlant);
            starCount++;
            starsContainer.innerHTML = "⭐".repeat(starCount);

            quizFeedback.style.color = "#2e7d32";
            quizFeedback.innerHTML = "🎉 우와 정답이에요! ⭐ 별 획득!";
            
            if (starSound) {
                starSound.currentTime = 0;
                starSound.play().catch(err => console.log("음원 재생 제한:", err));
            }

            setTimeout(() => {
                quizBox.style.display = 'none';
            }, 2000);

        } else {
            quizFeedback.style.color = "#d32f2f";
            quizFeedback.innerHTML = "❌ 아쉬워요! 다른 버튼을 눌러보세요!";
        }
    }
</script>

</body>
</html>
